<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color visualizer</title>
  </head>
  <body>
    <header>
      <div class="logo-container">
        <img class="img-logo" src="https://paletadecolores.org/images/rueda-de-colores.svg" alt="">
      </div>
      <h2 class="title">Color visualizer</h2>
      <nav>
        <ul class="nav-list">
          <li><a class="nav-link" href="#/home">Home</a></li>
          <li><a class="nav-link" href="#/about">About</a></li>
          <li><a class="nav-link" href="#/contact">Contact</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <h1>¡Hola! Color visualizer</h1>
      <p>
        Esta es una aplicación para visualizar colores, solo debes ingresar el codigo RGB, hexadecimales, etc permitidos por CSS.
        Si el color no se visualiza es porque no es un color valido.
      </p>
      <div class="visualizer-container">
        <div class="input-container">
          <input type="text" placeholder="Ingrese color" id="input-color">
          <input type="button" id="add-button" value="Agregar">
        </div>
        <div id="colors-container"></div>
      </div>
    </main>




    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
